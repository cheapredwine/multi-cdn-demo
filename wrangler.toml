# Multi-CDN demo — single config with deploy environments.
#
# Top-level: vitest target (test-only stub). Bindings are inherited by all envs.
# Deploys: `wrangler deploy --env public|secure|meter|portal|audit`.
#
# --- Runtime variables (set via dashboard or `wrangler vars put`) ---
# DOMAIN — the base domain for all demo hostnames (e.g. "demo.example.com")
#
# --- Secrets (set via wrangler secret put --env <name>) ---
# - JWT_SECRET (env.secure)

name = "multicdn-demo-test"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Preserve dashboard/CLI-set variables across redeploys
keep_vars = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "multicdn-demo-20260505-2351"

# ── Deploy: public-steering Worker ──────────────────────────────────
# Multi-mode steering.
# Run-of-show flips STEERING_MODE between passthrough / path_routing / percent_rollout.

[env.public]
name = "multicdn-demo-public-steering"
main = "src/workers/public-steering/index.ts"
routes = [{ pattern = "cf-pool.demo.jsherron.com", custom_domain = true }]
workers_dev = true

[env.public.vars]
STEERING_MODE = "passthrough"
ROLLOUT_PCT = "50"

[[env.public.r2_buckets]]
binding = "BUCKET"
bucket_name = "multicdn-demo-20260505-2351"

# ── Deploy: secure Worker ───────────────────────────────────────────
# JWT issuance + protected content + audit log.

[env.secure]
name = "multicdn-demo-secure"
main = "src/workers/secure/index.ts"
routes = [{ pattern = "secure.demo.jsherron.com", custom_domain = true }]
workers_dev = true

[[env.secure.r2_buckets]]
binding = "BUCKET"
bucket_name = "multicdn-demo-20260505-2351"

# ── Deploy: meter Worker ────────────────────────────────────────────
# Renders egress-meter UI from R2 counter.

[env.meter]
name = "multicdn-demo-meter"
main = "src/workers/meter/index.ts"
routes = [{ pattern = "meter.demo.jsherron.com", custom_domain = true }]
workers_dev = true

[[env.meter.r2_buckets]]
binding = "BUCKET"
bucket_name = "multicdn-demo-20260505-2351"

# ── Deploy: portal Worker ───────────────────────────────────────────
# Patient portal — serves the "Generate Link" UI.

[env.portal]
name = "multicdn-demo-portal"
main = "src/workers/portal/index.ts"
routes = [{ pattern = "portal.demo.jsherron.com", custom_domain = true }]
workers_dev = true

# ── Deploy: audit Worker ────────────────────────────────────────────
# Live audit log viewer — polls /audit/recent.

[env.audit]
name = "multicdn-demo-audit"
main = "src/workers/audit/index.ts"
routes = [{ pattern = "audit.demo.jsherron.com", custom_domain = true }]
workers_dev = true
